/**:
  ros__parameters:
    # B 原点：飞控板中心；FLU：前/左/上。平移单位米，四元数顺序 xyzw。
    # 相机在后方5cm、下方12.5cm；镜头向下，图像上方对应机体右方。
    camera_translation_B_m: [-0.050, 0.0, -0.125]
    camera_rotation_BC_xyzw: [0.0, 1.0, 0.0, 0.0]
    # 水平缸底标签 L -> Z向上局部世界 W；W 原点在该标签中心。
    tag_translation_W_m: [0.0, 0.0, 0.0]
    tag_rotation_WL_xyzw: [1.0, 0.0, 0.0, 0.0]
    imu_frame: base_link
    pressure_frame: base_link

    water_density_kg_m3: 1000.0
    # 可调的原型观测噪声初值，不是已测定位精度。
    pressure_height_std_m: 0.03
    vision_position_std_m: 0.03
    # 历史窗口用于吸收图像处理/网络延迟；已带源时间的观测不再被额外减时。
    history_s: 0.5
    pair_tolerance_s: 0.10
    # IMU 源时间大跳变后停估计并要求重启，不能把空白区间积分成真实运动。
    imu_max_gap_s: 0.10
    vision_timeout_s: 0.8
    pressure_timeout_s: 0.4
    # 启动保持静稳至 READY；5Hz视觉下上游协方差收敛可需数十秒，3s只是最低等待。
    # 位置/角度容差也用于丢标恢复后的融合/视觉一致性检查。
    startup_settle_s: 3.0
    startup_position_tolerance_m: 0.08
    startup_angle_tolerance_rad: 0.20
