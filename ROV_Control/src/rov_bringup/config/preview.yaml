# 通配节点路径允许 uuv00 / 其他 namespace 使用同一参数文件。
/**:
  ros__parameters:
    world_frame: map
    length_m: 0.2
    v_max_mps: 0.08
    a_max_mps2: 0.1
    min_duration_s: 0.1
    path_point_count: 101
    timer_period_s: 0.02
    max_state_age_s: 0.25
    future_tolerance_s: 0.05
    max_receive_gap_s: 2.0
    # 教学参考点活动盒，围绕 Hippo 初始 (1.3,1.0,-0.5)。
    # 已核对 pool.dae：unit=0.2、Z_UP；模型平移 (1,2,-1.5)。
    # 可视网格外包围约 x[-0.101,2.101], y[-0.101,4.101], z[-1.515,0.05]。
    # 此盒只约束参考中心点，不是池壁碰撞/真机安全验证；pool.xacro 没有 collision。
    workspace_min_W: [0.8, 0.5, -1.0]
    workspace_max_W: [1.8, 1.7, 0.0]
